<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Gateway chat</title>
  <link rel="stylesheet" href="/shared/nav.css">
  <link rel="stylesheet" href="/chat/assets/chat.css">
</head>
<body>
  <nav id="site-nav"></nav>

  <main class="chat-layout">
    <section class="panel" aria-labelledby="chat-title">
      <h1 id="chat-title">Chat</h1>

      <div class="chat-controls">
        <label class="control">
          <span>Model</span>
          <select id="model"></select>
        </label>
        <label class="control">
          <input type="checkbox" id="compare">
          <span>Compare two models</span>
        </label>
        <span id="compare-pickers" class="chat-controls" hidden>
          <label class="control">
            <span>Left model</span>
            <select id="left-model"></select>
          </label>
          <label class="control">
            <span>Right model</span>
            <select id="right-model"></select>
          </label>
        </span>
        <button type="button" id="new-chat">New chat</button>
      </div>

      <p id="fake-banner" class="banner" hidden>Fake mode: answers are simulated placeholders, not real model output.</p>
      <p class="note">Requests made here are recorded in the database like any other request.</p>
      <p id="compare-note" class="note" hidden>Compare mode sends each question on its own, without earlier messages.</p>
      <p id="page-error" class="error" role="alert" hidden></p>

      <div id="conversation" class="conversation" aria-live="polite" aria-label="Conversation"></div>

      <form id="composer" class="composer">
        <label for="input" class="sr-only">Message</label>
        <textarea id="input" rows="3" placeholder="Ask a question. Enter sends, Shift+Enter adds a new line."></textarea>
        <div class="composer-row">
          <button type="submit" id="send" class="primary">Send</button>
          <span id="waiting" class="muted"></span>
        </div>
      </form>
    </section>

    <aside class="panel inspector" aria-labelledby="inspector-title">
      <h2 id="inspector-title">Inspector</h2>
      <div id="inspector"></div>
    </aside>
  </main>

  <script src="/shared/nav.js" defer></script>
  <script src="/chat/assets/chat.js" defer></script>
</body>
</html>
