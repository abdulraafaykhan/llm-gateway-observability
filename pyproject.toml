[project]
name = "llm-gateway"
version = "0.1.0"
description = "A small gateway server that forwards chat requests to LLM providers."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "groq>=1.7.0",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]
